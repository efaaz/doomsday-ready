services:
  mongodb:
    image: mongo:7
    container_name: doomsday-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    build:
      context: ./server
    command: npm run seed
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/doomsday_ready
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ./server
    container_name: doomsday-server
    command: npm run dev
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/doomsday_ready
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
    container_name: doomsday-client
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongodb_data: